<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rehearse · Run workspace prototype</title>
		<style>
			:root {
				color-scheme: dark;
				--canvas: #12141e;
				--surface: #191c29;
				--raised: #202436;
				--hover: #252a3e;
				--line: #343a50;
				--text: #e9ecf6;
				--muted: #a4adc5;
				--accent: #b9adff;
				--accent-wash: #302b4b;
				--live: #81d4d4;
				--live-wash: #193537;
				--good: #a6cfb4;
				--good-wash: #25382f;
				--warn: #ecc88c;
				--warn-wash: #3b3225;
				--bad: #f2a5b1;
				--bad-wash: #3c2833;
				--font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				--display: "Arial", sans-serif;
				--mono: "SFMono-Regular", Consolas, monospace;
				--xs: 12px;
				--sm: 13px;
				--base: 14px;
				--lg: 18px;
				--xl: 26px;
				--s1: 4px;
				--s2: 8px;
				--s3: 12px;
				--s4: 16px;
				--s5: 20px;
				--s6: 24px;
				--s8: 32px;
				--border-live: #356063;
				--border-good: #46614e;
				--border-warn: #6b593b;
				--accent-hover: #ccbeff;
				--metric: 22px;
				--metric-lg: 24px;
				--radius: 8px;
				--radius-sm: 5px;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--canvas);
				color: var(--text);
				font: var(--base)/1.5 var(--font);
			}
			button,
			input,
			select,
			textarea {
				font: inherit;
				color: inherit;
			}
			button,
			a,
			input,
			select,
			textarea,
			summary {
				-webkit-tap-highlight-color: transparent;
			}
			button,
			a {
				touch-action: manipulation;
			}
			button {
				cursor: pointer;
			}
			a {
				color: var(--accent);
				text-decoration: none;
			}
			a:not(.skip) {
				min-height: 44px;
				display: inline-flex;
				align-items: center;
			}
			a:hover {
				text-decoration: underline;
			}
			:focus-visible {
				outline: 2px solid var(--live);
				outline-offset: 3px;
			}
			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			h1,
			h2,
			h3,
			p {
				margin: 0;
			}
			summary {
				min-height: 44px;
				cursor: pointer;
			}
			h1 {
				font: 600 var(--xl)/1.2 var(--display);
				letter-spacing: -0.6px;
			}
			h2 {
				font: 600 var(--lg)/1.4 var(--display);
				letter-spacing: -0.2px;
			}
			h3 {
				font-size: var(--base);
				font-weight: 600;
			}
			small,
			.small {
				font-size: var(--xs);
			}
			.muted {
				color: var(--muted);
			}
			.mono,
			code,
			pre {
				font-family: var(--mono);
			}
			.mono {
				font-size: var(--sm);
			}
			.accent {
				color: var(--accent);
			}
			.good {
				color: var(--good);
			}
			.warn {
				color: var(--warn);
			}
			.live {
				color: var(--live);
			}
			.row {
				display: flex;
				align-items: center;
				gap: var(--s3);
				flex-wrap: wrap;
			}
			.between {
				justify-content: space-between;
			}
			.stack {
				display: flex;
				flex-direction: column;
				gap: var(--s4);
			}
			.gap2 {
				gap: var(--s2);
			}
			.btn,
			.chip {
				min-width: 44px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: var(--s2);
				border: 1px solid var(--line);
				border-radius: var(--radius-sm);
				background: transparent;
				padding: var(--s2) var(--s3);
				min-height: 44px;
				white-space: nowrap;
			}
			.btn:hover,
			.chip:hover {
				background: var(--hover);
				text-decoration: none;
			}
			.primary {
				background: var(--accent);
				color: var(--canvas);
				border-color: var(--accent);
				font-weight: 600;
			}
			.primary:hover {
				background: var(--accent-hover);
			}
			.danger {
				color: var(--bad);
			}
			.chip {
				font-size: var(--sm);
				border-color: transparent;
				color: var(--muted);
			}
			.chip[aria-pressed="true"] {
				background: var(--raised);
				border-color: var(--line);
				color: var(--text);
			}
			.badge {
				display: inline-flex;
				gap: var(--s2);
				align-items: center;
				font-size: var(--xs);
				padding: var(--s1) var(--s2);
				background: var(--raised);
				border: 1px solid var(--line);
				border-radius: var(--radius-sm);
				white-space: nowrap;
			}
			.badge.running {
				background: var(--live-wash);
				color: var(--live);
				border-color: var(--border-live);
			}
			.badge.completed {
				background: var(--good-wash);
				color: var(--good);
				border-color: var(--border-good);
			}
			.badge.stopped,
			.badge.paused {
				background: var(--warn-wash);
				color: var(--warn);
				border-color: var(--border-warn);
			}
			.rule {
				height: 1px;
				background: var(--line);
				margin: var(--s2) 0;
			}
			.panel {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				overflow: hidden;
				min-width: 0;
			}
			.pad {
				padding: var(--s5);
			}
			.panel-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s3);
				padding: var(--s4) var(--s5);
				border-bottom: 1px solid var(--line);
				flex-wrap: wrap;
			}
			.notice {
				padding: var(--s3) var(--s4);
				border-left: 2px solid var(--accent);
				background: var(--accent-wash);
				border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
			}
			.notice.warn-note {
				background: var(--warn-wash);
				border-color: var(--warn);
			}
			.eyebrow {
				color: var(--muted);
				font-size: var(--xs);
				letter-spacing: 1px;
				text-transform: uppercase;
			}
			.app {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				min-height: 100dvh;
			}
			.sidebar {
				min-width: 0;
				padding: var(--s4);
				background: var(--surface);
				border-bottom: 1px solid var(--line);
				display: flex;
				flex-direction: column;
				gap: var(--s4);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: var(--s3);
				color: var(--text);
				font-size: var(--lg);
				font-weight: 600;
				letter-spacing: -0.5px;
			}
			.mark {
				display: grid;
				grid-template-columns: repeat(3, 4px);
				gap: var(--s1);
				height: 22px;
				align-items: end;
			}
			.mark i {
				width: 4px;
				background: var(--accent);
				border-radius: 2px;
				height: 14px;
			}
			.mark i:nth-child(2) {
				height: 22px;
			}
			.mark i:nth-child(3) {
				height: 18px;
			}
			.global-nav {
				display: flex;
				gap: var(--s1);
				flex-wrap: nowrap;
				overflow-x: auto;
			}
			.nav-link {
				flex-shrink: 0;
				display: flex;
				align-items: center;
				gap: var(--s3);
				min-height: 44px;
				border-radius: var(--radius-sm);
				padding: var(--s2) var(--s3);
				color: var(--muted);
			}
			.nav-link.active {
				background: var(--accent-wash);
				color: var(--text);
			}
			.nav-link:hover {
				background: var(--hover);
				text-decoration: none;
			}
			.nav-link svg {
				width: 17px;
				height: 17px;
				flex-shrink: 0;
			}
			.nav-link .count {
				margin-left: auto;
				font: var(--xs) var(--mono);
				color: var(--live);
			}
			.sidebar-bottom {
				display: none;
			}
			.main {
				min-width: 0;
			}
			.prototype-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s3);
				flex-wrap: wrap;
				padding: var(--s2) var(--s5);
				border-bottom: 1px solid var(--line);
				font-size: var(--xs);
				color: var(--muted);
			}
			.prototype-bar strong {
				color: var(--accent);
				font-weight: 500;
			}
			.prototype-bar button {
				background: none;
				color: var(--muted);
				border: 0;
				min-height: 44px;
				text-decoration: underline;
			}
			.content {
				padding: var(--s5);
				max-width: 1560px;
				margin: auto;
			}
			.page-head {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: var(--s4);
				flex-wrap: wrap;
				margin-bottom: var(--s6);
			}
			.page-head p {
				color: var(--muted);
				margin-top: var(--s2);
			}
			.stats {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: var(--s4);
			}
			.stat {
				padding-right: var(--s4);
			}
			.stat strong {
				font: 500 var(--metric)/1.5 var(--mono);
				display: block;
				letter-spacing: -0.7px;
			}
			.stat .label {
				color: var(--muted);
				font-size: var(--xs);
			}
			.toolbar {
				display: flex;
				gap: var(--s3);
				justify-content: space-between;
				align-items: center;
				flex-wrap: wrap;
				margin-bottom: var(--s4);
			}
			input,
			select,
			textarea {
				width: 100%;
				min-height: 44px;
				border: 1px solid var(--line);
				background: var(--canvas);
				border-radius: var(--radius-sm);
				padding: var(--s2) var(--s3);
			}
			textarea {
				min-height: 150px;
				resize: vertical;
				line-height: 1.7;
			}
			.search {
				width: 100%;
			}
			.search input {
				background: var(--surface);
			}
			.run-list {
				display: flex;
				flex-direction: column;
			}
			.run-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: center;
				gap: var(--s3);
				padding: var(--s4) var(--s5);
				border-bottom: 1px solid var(--line);
			}
			.run-row:last-child {
				border: 0;
			}
			.run-row:hover {
				background: var(--raised);
			}
			.run-title {
				display: block;
				color: var(--text);
				font-weight: 500;
				padding: var(--s2) 0;
				min-height: 44px;
			}
			.run-title:hover {
				color: var(--accent);
			}
			.run-meta {
				color: var(--muted);
				font-size: var(--xs);
				display: flex;
				gap: var(--s2);
				flex-wrap: wrap;
			}
			.run-numbers {
				text-align: right;
			}
			.run-numbers strong {
				font: var(--sm) var(--mono);
				display: block;
			}
			.run-result {
				grid-column: 1 / -1;
			}
			.run-version {
				display: none;
			}
			.live-card {
				border-color: var(--border-live);
				margin-bottom: var(--s6);
			}
			.live-card .panel-head {
				background: var(--live-wash);
				border-color: var(--border-live);
			}
			.live-card .run-row {
				padding-top: var(--s5);
				padding-bottom: var(--s5);
			}
			.breadcrumbs {
				display: flex;
				gap: var(--s2);
				align-items: center;
				margin-bottom: var(--s5);
				color: var(--muted);
				font-size: var(--sm);
			}
			.breadcrumbs a {
				min-height: 44px;
				display: inline-flex;
				align-items: center;
			}
			.run-header {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: var(--s4);
				flex-wrap: wrap;
				margin-bottom: var(--s5);
			}
			.run-header h1 {
				margin-bottom: var(--s3);
			}
			.view-nav {
				display: flex;
				gap: var(--s4);
				overflow-x: auto;
				border-bottom: 1px solid var(--line);
				margin: var(--s6) 0 var(--s5);
			}
			.view-nav :is(a, button) {
				min-width: 44px;
				background: transparent;
				border: 0;
				display: inline-flex;
				align-items: center;
				gap: var(--s2);
				color: var(--muted);
				border-bottom: 2px solid transparent;
				padding: var(--s3) 0;
				min-height: 48px;
				white-space: nowrap;
			}
			.view-nav :is(a, button).active {
				color: var(--text);
				border-color: var(--accent);
			}
			.view-nav :is(a, button):hover {
				text-decoration: none;
				color: var(--text);
			}
			.step-spine {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: var(--s2);
				margin-bottom: var(--s5);
			}
			.step {
				text-align: left;
				padding: var(--s3) var(--s4);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				min-height: 92px;
			}
			.step:hover {
				background: var(--raised);
			}
			.step[aria-pressed="true"] {
				border-color: var(--accent);
				box-shadow: inset 0 2px var(--accent);
				background: var(--raised);
			}
			.step.current[aria-pressed="true"] {
				border-color: var(--live);
				box-shadow: inset 0 2px var(--live);
			}
			.step-title {
				display: flex;
				gap: var(--s2);
				align-items: center;
				justify-content: space-between;
				margin-bottom: var(--s2);
			}
			.step small {
				color: var(--muted);
				display: block;
			}
			.step-caption {
				display: flex;
				justify-content: space-between;
				gap: var(--s2);
				flex-wrap: wrap;
				margin: var(--s5) 0 var(--s3);
			}
			.two-col,
			.context-grid,
			.compare-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: var(--s4);
				align-items: start;
			}
			.transcript {
				padding: var(--s4) var(--s5);
				display: flex;
				flex-direction: column;
				gap: var(--s4);
			}
			.entry {
				display: grid;
				grid-template-columns: 48px minmax(0, 1fr);
				gap: var(--s3);
			}
			.entry time {
				color: var(--muted);
				font: var(--xs)/1.7 var(--mono);
			}
			.entry .who {
				font-size: var(--xs);
				color: var(--accent);
				display: block;
				margin-bottom: var(--s1);
			}
			pre {
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				font-size: var(--xs);
				line-height: 1.7;
				margin: 0;
			}
			.tool {
				background: var(--canvas);
				border-left: 2px solid var(--line);
				padding: var(--s3);
				border-radius: var(--radius-sm);
			}
			.check {
				padding: var(--s3) 0;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s3);
				border-bottom: 1px solid var(--line);
			}
			.check:last-child {
				border: 0;
			}
			.check-label {
				min-width: 0;
			}
			.check .btn {
				color: var(--accent);
			}
			.grade {
				font: 500 var(--metric) var(--mono);
				min-width: 28px;
			}
			.list-item {
				padding: var(--s4) 0;
				border-bottom: 1px solid var(--line);
			}
			.list-item:last-child {
				border: 0;
			}
			.definition {
				display: grid;
				grid-template-columns: 110px minmax(0, 1fr);
				gap: var(--s2) var(--s3);
				margin: 0;
			}
			.definition dt {
				color: var(--muted);
			}
			.definition dd {
				min-width: 0;
				margin: 0;
				overflow-wrap: anywhere;
			}
			.meter {
				height: 6px;
				background: var(--line);
				border-radius: 3px;
				margin-top: var(--s2);
				overflow: hidden;
			}
			.meter span {
				display: block;
				width: var(--value);
				height: 100%;
				background: var(--accent);
			}
			.source-btn > span {
				min-width: 0;
				flex: 1;
				overflow-wrap: anywhere;
			}
			.source-btn {
				display: flex;
				justify-content: space-between;
				gap: var(--s3);
				width: 100%;
				min-height: 60px;
				padding: var(--s3);
				background: transparent;
				border: 1px solid transparent;
				border-radius: var(--radius-sm);
				text-align: left;
			}
			.source-btn:hover,
			.source-btn[aria-pressed="true"] {
				background: var(--raised);
				border-color: var(--line);
			}
			.source-btn small {
				display: block;
				color: var(--muted);
			}
			.chart {
				overflow-x: auto;
				height: 180px;
				display: flex;
				align-items: end;
				gap: var(--s1);
				padding-top: var(--s4);
				border-bottom: 1px solid var(--line);
			}
			.request {
				position: relative;
				flex: 1;
				height: 100%;
				min-width: 44px;
				padding: 0;
				border: 0;
				background: transparent;
				display: flex;
				align-items: end;
				justify-content: center;
			}
			.request::after {
				content: "";
				height: var(--value);
				width: 74%;
				background: var(--accent);
				opacity: 0.6;
				border-radius: 3px 3px 0 0;
			}
			.request[aria-pressed="true"] {
				background: var(--accent-wash);
			}
			.request[aria-pressed="true"]::after {
				opacity: 1;
				background: var(--live);
			}
			.chart-axis {
				display: flex;
				justify-content: space-between;
				color: var(--muted);
				font: var(--xs) var(--mono);
				margin-top: var(--s2);
			}
			.legend {
				display: flex;
				gap: var(--s4);
				margin-top: var(--s3);
				color: var(--muted);
				font-size: var(--xs);
				flex-wrap: wrap;
			}
			.table-scroll {
				overflow-x: auto;
			}
			table {
				border-collapse: collapse;
				width: 100%;
				text-align: left;
				font-size: var(--sm);
			}
			th,
			td {
				padding: var(--s3) var(--s4);
				border-bottom: 1px solid var(--line);
				vertical-align: top;
			}
			th {
				color: var(--muted);
				font-size: var(--xs);
				font-weight: 500;
				white-space: nowrap;
			}
			td {
				min-width: 95px;
			}
			tbody tr:last-child td {
				border-bottom: 0;
			}
			.arm {
				border-top: 3px solid var(--line);
			}
			.arm.candidate {
				border-top-color: var(--accent);
			}
			.arm .fig {
				font: 500 var(--metric-lg)/1.5 var(--mono);
			}
			.empty {
				padding: var(--s8);
				text-align: center;
				color: var(--muted);
			}
			.empty h2 {
				color: var(--text);
				margin-bottom: var(--s2);
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
			}
			dialog {
				background: var(--surface);
				color: var(--text);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				padding: 0;
				width: min(580px, calc(100% - 24px));
				max-height: 88dvh;
				box-shadow: 0 20px 80px #0009;
			}
			dialog::backdrop {
				background: #080a13b8;
				backdrop-filter: blur(3px);
			}
			dialog .dialog-body {
				padding: var(--s5);
				display: flex;
				flex-direction: column;
				gap: var(--s5);
			}
			dialog .dialog-footer {
				padding: var(--s4) var(--s5);
				display: flex;
				justify-content: flex-end;
				gap: var(--s3);
				border-top: 1px solid var(--line);
				flex-wrap: wrap;
			}
			.evidence-quote {
				border-left: 2px solid var(--accent);
				padding: var(--s3) var(--s4);
				background: var(--canvas);
				margin: 0;
			}
			#toast {
				position: fixed;
				bottom: var(--s5);
				left: var(--s4);
				right: var(--s4);
				max-width: 600px;
				margin: auto;
				padding: var(--s4) var(--s5);
				background: var(--raised);
				border: 1px solid var(--accent);
				border-radius: var(--radius);
				box-shadow: 0 8px 32px #0006;
				z-index: 5;
			}
			#toast:empty {
				display: none;
			}
			.skip {
				position: fixed;
				left: var(--s4);
				top: -100px;
				z-index: 10;
				padding: var(--s3);
				background: var(--accent);
				color: var(--canvas);
			}
			.skip:focus {
				top: var(--s4);
			}
			.diff-line {
				padding: var(--s2) var(--s3);
				font: var(--xs)/1.7 var(--mono);
				overflow-wrap: anywhere;
			}
			.diff-line.remove {
				background: var(--bad-wash);
				color: var(--bad);
			}
			.diff-line.add {
				background: var(--good-wash);
				color: var(--good);
			}
			@media (min-width: 640px) {
				.stats {
					grid-template-columns: repeat(4, minmax(0, 1fr));
				}
				.search {
					width: 260px;
				}
				.step-spine {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
				.run-row {
					grid-template-columns: minmax(0, 1fr) minmax(100px, 0.6fr) 80px;
				}
				.run-result {
					grid-column: auto;
				}
				.compare-grid {
					grid-template-columns: repeat(3, minmax(0, 1fr));
				}
			}
			@media (min-width: 1024px) {
				.app {
					grid-template-columns: 188px minmax(0, 1fr);
				}
				.sidebar {
					position: sticky;
					top: 0;
					height: 100dvh;
					padding: var(--s6) var(--s3);
					border-right: 1px solid var(--line);
					border-bottom: 0;
				}
				.brand {
					padding: 0 var(--s3);
					margin-bottom: var(--s6);
				}
				.global-nav {
					flex-direction: column;
				}
				.sidebar-bottom {
					display: flex;
					flex-direction: column;
					gap: var(--s4);
					margin-top: auto;
					padding: var(--s3);
					font-size: var(--xs);
				}
				.sidebar-bottom a {
					min-height: 44px;
					display: flex;
					align-items: center;
				}
				.content {
					padding: var(--s6) var(--s8) var(--s8);
				}
				.two-col {
					grid-template-columns: minmax(0, 1.55fr) minmax(260px, 1fr);
				}
				.context-grid {
					grid-template-columns: 240px minmax(0, 1fr);
				}
				.run-row {
					grid-template-columns: minmax(0, 1.4fr) minmax(130px, 1fr) 120px 90px;
				}
				.run-version {
					display: block;
				}
			}
			@media (prefers-reduced-motion: no-preference) {
				.btn,
				.step,
				.nav-link {
					transition:
						background 120ms,
						border-color 120ms;
				}
			}
		</style>
	</head>
	<body>
		<a class="skip" href="#main">Skip to content</a>
		<div id="app"></div>
		<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
		<div id="toast" role="status" aria-live="polite"></div>
		<script>
			const initialRuns = [
				{
					id: "r42",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "running",
					cost: 3.42,
					time: "8m 24s",
					version: "0a78c2",
					grade: "Pending",
					step: "build",
					when: "Today, 14:32",
					note: "Build is running · Shape accepted",
					progress: 1,
				},
				{
					id: "r41",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "completed",
					cost: 4.86,
					time: "12m 08s",
					version: "0a78c2",
					grade: "B",
					step: "build",
					when: "Today, 13:48",
					note: "Accepted · all checks passed",
					progress: 2,
				},
				{
					id: "r40",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "stopped",
					cost: 1.73,
					time: "5m 43s",
					version: "7733aa",
					grade: "C",
					step: "shape",

					note: "Stopped at Shape · below minimum B",
					progress: 0,

				{

					step: "shape",

					note: "3 attempts · checkpoint cp-a7 · candidate",
					progress: 1,
				},
				{
					id: "g7",
					case: "audit-log",
					title: "Shape · original review instructions",
					kind: "Group",
					state: "completed",
					cost: 7.26,
					time: "8m 06s",
					version: "7733aa",
					grade: "3/3 accepted",
					step: "shape",
					when: "Yesterday, 16:40",
					note: "3 attempts · checkpoint cp-a7 · before edit",
					progress: 1,
				},
				{
					id: "r39",
					noTranscript: true,
					case: "audit-log",
					title: "Replay Shape from r35",
					kind: "Replay",
					state: "completed",
					cost: 1.95,
					time: "6m 00s",
					version: "0a78c2",
					grade: "B",
					step: "shape",
					when: "Yesterday, 16:17",
					note: "From r35 / Shape · checkpoint cp-a7",
					progress: 1,
				},
				{
					id: "s12",
					case: "brief-reply",
					title: "Keep a technical reply concise",
					kind: "Session",
					state: "completed",
					cost: 0.08,
					time: "24s",
					version: "0a78c2",
					grade: "Passed",
					step: "session",
					when: "Yesterday, 15:02",
					note: "3 of 3 deterministic checks passed",
					progress: 1,
				},
				{
					id: "s11",
					case: "brief-reply",
					title: "Keep a technical reply concise",
					kind: "Session",
					state: "stopped",
					cost: 0,
					time: "—",
					version: "7733aa",
					grade: "Unavailable",
					step: "session",
					when: "Time not recorded",
					note: "Invocation failed · no reply or usage recorded",
					progress: 0,
					missing: true,
				},
			];
			initialRuns.splice(2, 0, {
				...initialRuns[1],
				id: "r37",
				finalOutcome: "FAIL",
				cost: 4.55,
				time: "11m 14s",
				when: "Today, 13:16",
				note: "Final FAIL · both steps accepted · empty-page contract missing",
			});
			function finalReading(run) {
				if (run.kind !== "Pipeline") return run.grade;
				if (run.state === "running") return "Pending";
				if (run.state !== "completed") return "Not reached";
				return run.finalOutcome || "PASS";
			}
			function elapsedSeconds(time) {
				const parts = time.match(/(?:(\d+)m )?(\d+)s/);
				if (!parts) return 0;
				return Number(parts[1] || 0) * 60 + Number(parts[2]);
			}
			function initializeReadings(run) {
				if (run.kind === "Group") return run;
				if (run.kind === "Pipeline") {
					if (run.step === "shape") {
						run.stepReadings = {
							shape: { cost: run.cost, seconds: elapsedSeconds(run.time) },
						};
						return run;
					}
					run.stepReadings = {
						shape: { cost: 1.18, seconds: 252 },
						build: {
							cost: Math.max(0, run.cost - 1.18),
							seconds: Math.max(0, elapsedSeconds(run.time) - 252),
						},
					};
					return run;
				}
				run.stepReadings = {
					[run.step]: { cost: run.cost, seconds: elapsedSeconds(run.time) },
				};
				return run;
			}
			function stepMetrics(run, step) {
				const phase = stepPhase(run, step),
					reading = run.stepReadings?.[step];
				if (phase === "queued")
					return { cost: "Pending", time: "Not started", value: 0 };
				if (phase === "unavailable" || !reading)
					return { cost: "Unavailable", time: "Not recorded", value: 0 };
				return {
					cost: money(reading.cost),
					time:
						Math.floor(reading.seconds / 60) +
						"m " +
						String(reading.seconds % 60).padStart(2, "0") +
						"s" +
						(phase === "running" ? " so far" : ""),
					value: reading.cost,
				};
			}
			function finishReadings(run) {
				const ceiling = run.budget || 10;
				if (run.kind === "Pipeline") {
					const total = Math.min(4.86, ceiling),
						shape = Math.min(1.18, total * 0.25);
					run.stepReadings = {
						shape: { cost: shape, seconds: 252 },
						build: { cost: total - shape, seconds: 476 },
					};
					run.cost = total;
					run.time = "12m 08s";
					run.step = "build";
					run.progress = 2;
					return;
				}
				const cost = Math.min(run.step === "session" ? 0.08 : 1.8, ceiling),
					seconds = run.step === "session" ? 24 : 360;
				run.stepReadings = { [run.step]: { cost, seconds } };
				run.cost = cost;
				run.time =
					Math.floor(seconds / 60) +
					"m " +
					String(seconds % 60).padStart(2, "0") +
					"s";
				run.progress = 1;
			}
			initialRuns.splice(3, 0, {
				...initialRuns[1],
				id: "r36",
				finalOutcome: "Judging failed",
				cost: 4.64,
				time: "12m 10s",
				when: "Today, 12:45",
				note: "Final judge failed · no verdict returned",
			});
			function finalReport(run) {
				if (run.kind !== "Pipeline") return "";
				const outcome = finalReading(run),
					judged = ["PASS", "FAIL"].includes(outcome);
				return (
					'<section class="panel"><div class="panel-head"><h2>Final workflow outcome</h2><span class="badge ' +
					(outcome === "PASS"
						? "completed"
						: outcome === "FAIL"
							? "stopped"
							: "") +
					'">' +
					outcome +
					'</span></div><div class="pad stack"><p>' +
					{
						FAIL: "Both steps met minimum B, but the final artifact omits the required empty-page field. The final judge returned FAIL.",
						PASS: "The final judge returned PASS against the original task input and final artifact.",
						Pending:
							"The final outcome is pending until the workflow reaches its final judge.",
						"Judging failed":
							"The final judge did not return a valid verdict. This is missing grading evidence, not a failed task. Accepted step grades remain available.",
						"Not reached":
							"The workflow ended before final grading. Accepted step grades remain valid; no final outcome was recorded.",
					}[outcome] +
					'</p><p class="muted small">Graded independently of step letters. The final judge sees the original input and final artifact.</p>' +
					(judged ? btn("Inspect final evidence", "final-evidence") : "") +
					"</div></section>"
				);
			}
			function costReading(groupId) {
				const costs = state.runs
					.filter((item) => item.parent === groupId)
					.map((item) => item.cost);
				return (
					money(costs.reduce((a, b) => a + b, 0) / costs.length) +
					" · " +
					money(Math.min(...costs)) +
					"–" +
					money(Math.max(...costs))
				);
			}
			const initialInstruction =
				"Read the relevant evidence once. Give each reviewer the shared evidence, then inspect only the findings that need verification.";
			function initialState() {
				return {
					defaultBudget: 10,
					reviews: {},
					reviewTarget: null,
					runs: structuredClone(initialRuns).map(initializeReadings),
					filter: "All",
					search: "",
					selectedStep: {},
					source: "all",
					agent: "parent",
					request: 1,
					follow: true,
					caseTab: "Overview",
					settingsTab: "General",
					version: "0a78c2",
					draft: initialInstruction,
					instruction: initialInstruction,
					review: "B",
					versionCounter: 0,
				};
			}
			const state = initialState();
			const $ = (selector) => document.querySelector(selector);
			const esc = (text) =>
				String(text)
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;")
					.replaceAll("'", "&#39;");
			const money = (value) => "$" + value.toFixed(2);
			const icons = {
				runs: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
				compare: '<path d="M3 3v18M21 3v18M7 7h10l-3-3m3 13H7l3 3"/>',
				cases:
					'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 5V3h8v2M3 11h18"/>',
				corpus:
					'<path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3zM7 16h13M8 7h8M8 11h6"/>',
				settings:
					'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
			};
			const icon = (name) =>
				'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
				icons[name] +
				"</svg>";
			const badge = (run) =>
				'<span class="badge ' +
				run.state +
				'">' +
				{
					running: "● Running",
					completed: "✓ Completed",
					stopped: "■ Stopped",
					paused: "Ⅱ Paused",
				}[run.state] +
				"</span>";
			const btn = (label, action, kind = "") =>
				'<button class="btn ' +
				kind +
				'" data-action="' +
				action +
				'">' +
				label +
				"</button>";
			const notice = (text, warning = false) =>
				'<div class="notice ' +
				(warning ? "warn-note" : "") +
				'">' +
				text +
				"</div>";
			const route = () =>
				(location.hash.slice(1) || "/runs").split("/").filter(Boolean);
			const runHref = (run, view) =>
				"#/runs/" +
				run.id +
				"/" +
				(view || (run.state === "running" ? "activity" : "overview"));
			const getRun = () => state.runs.find((run) => run.id === route()[1]);
			const stepsFor = (run) =>
				run.kind === "Pipeline" || run.groupMode === "pipeline"
					? ["shape", "build"]
					: [run.step];
			const selectedStep = (run) => state.selectedStep[run.id] || run.step;
			const stat = (label, value, note = "") =>
				'<div class="stat"><span class="label">' +
				label +
				"</span><strong>" +
				value +
				'</strong><small class="muted">' +
				note +
				"</small></div>";
			function shell(content) {
				const section = route()[0];
				const nav = [
					["runs", "Runs"],
					["compare", "Comparisons"],
					["cases", "Cases"],
					["corpus", "Corpus"],
					["settings", "Settings"],
				];
				const running = state.runs.filter(
					(run) => run.state === "running" && !run.parent,
				).length;
				return (
					'<div class="app"><aside class="sidebar"><a class="brand" href="#/runs"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Rehearse</a><nav class="global-nav" aria-label="Main navigation">' +
					nav
						.map(
							([id, label]) =>
								'<a class="nav-link ' +
								(section === id ? "active" : "") +
								'" ' +
								(section === id ? 'aria-current="page"' : "") +
								' href="#/' +
								id +
								'">' +
								icon(id) +
								label +
								(id === "runs" && running
									? '<span class="count">' + running + " live</span>"
									: "") +
								"</a>",
						)
						.join("") +
					'</nav><div class="sidebar-bottom"><span class="eyebrow">Corpus under test</span><a href="#/corpus"><span class="mono">corpus@' +
					state.version +
					'</span></a><span class="muted">137 files · demo snapshot</span><div class="rule"></div><span class="muted">Test an instruction.<br>Follow the evidence.</span></div></aside><main class="main" id="main" tabindex="-1"><div class="prototype-bar"><span><strong>Interactive prototype</strong> · synthetic data · actions are simulated</span><button data-action="reset">Reset demo</button></div><div class="content">' +
					content +
					"</div></main></div>"
				);
			}
			function runRow(run) {
				return (
					'<div class="run-row"><div><a class="run-title" href="' +
					runHref(run) +
					'">' +
					esc(run.case) +
					' <span class="muted">/</span> <span class="mono">' +
					run.id +
					'</span> <span class="muted">↗</span></a><div class="run-meta"><span>' +
					run.kind +
					"</span><span>·</span><span>" +
					run.when +
					'</span></div></div><div class="run-result"><div class="row gap2">' +
					badge(run) +
					' <span class="mono">' +
					finalReading(run) +
					'</span></div><small class="muted">' +
					run.note +
					'</small></div><div class="run-version"><span class="mono">' +
					run.version +
					'</span><br><small class="' +
					(run.version === state.version ? "muted" : "warn") +
					'">' +
					(run.version === state.version
						? "✓ Current corpus"
						: "◐ Corpus changed") +
					'</small></div><div class="run-numbers"><strong>' +
					(run.missing ? "Unavailable" : money(run.cost)) +
					'</strong><small class="muted">' +
					run.time +
					"</small></div></div>"
				);
			}
			function runsPage() {
				const indexed = state.runs.filter((run) => !run.parent);
				const live = indexed.filter((run) => run.state === "running");
				const pinned = live.length && state.filter === "All" && !state.search;
				const filtered = indexed.filter((run) => {
					if (pinned && run.state === "running") return false;
					let matches = true;
					switch (state.filter) {
						case "All":
							break;
						case "Running":
							matches = run.state === "running";
							break;
						case "Stopped":
							matches = ["stopped", "paused"].includes(run.state);
							break;
						case "Current corpus":
							matches = run.version === state.version;
							break;
						default:
							matches = run.kind === state.filter;
					}
					return (
						matches &&
						[run.case, run.title, run.id, run.version, run.note]
							.join(" ")
							.toLowerCase()
							.includes(state.search.toLowerCase())
					);
				});
				return (
					'<header class="page-head"><div><h1>Runs</h1><p>Follow a run. Inspect its evidence. Test the next change.</p></div>' +
					btn("+ New run", "launch", "primary") +
					"</header>" +
					(pinned
						? '<section class="panel live-card" aria-label="Runs in progress"><div class="panel-head"><span class="row"><span class="live">● In progress</span><small class="muted">Click a run to follow its activity</small></span><span class="small muted">' +
							live.length +
							" running</span></div>" +
							live.map(runRow).join("") +
							"</section>"
						: "") +
					'<div class="toolbar"><div class="row gap2" role="group" aria-label="Filter runs">' +
					[
						"All",
						"Running",
						"Stopped",
						"Group",
						"Replay",
						"Session",
						"Current corpus",
					]
						.map(
							(f) =>
								'<button class="chip" data-filter="' +
								f +
								'" aria-pressed="' +
								(state.filter === f) +
								'">' +
								({ Group: "Groups", Replay: "Replays", Session: "Sessions" }[
									f
								] || f) +
								"</button>",
						)
						.join("") +
					'</div><label class="search"><input id="search" type="search" aria-label="Search runs" placeholder="Search case, run, corpus…" value="' +
					esc(state.search) +
					'" /></label></div><section class="panel" aria-label="Run history"><div class="panel-head"><h2>History</h2><span class="small muted">' +
					filtered.length +
					' records · newest first</span></div><div id="run-rows">' +
					(filtered.length
						? filtered.map(runRow).join("")
						: '<div class="empty"><h2>No matching runs</h2><p>Try another case, corpus version, or filter.</p></div>') +
					'</div></section><p class="muted small" style="margin-top:var(--s4)">Synthetic examples include missing evidence and failed invocations. A missing measurement is never zero.</p>'
				);
			}
			function stepPhase(run, step) {
				if (run.missing) return "unavailable";
				if (step === "build" && run.step === "shape" && run.progress < 2)
					return "queued";

										? [280, 308, 360]
										: [300, 390, 420])[i - 1],
								grade: group.id === "g6" && i < 3 ? "C" : "B",
								state: group.id === "g6" && i < 3 ? "stopped" : "completed",
								note: "Independent attempt " + i + " · from " + group.id,
								when: "Yesterday · group " + group.id,
								step: "shape",
								parent: group.id,
							}),
						);
			}
			seedAttempts();
			document.addEventListener("click", (event) => {
				if (event.target.closest(".skip")) {
					event.preventDefault();
					$("#main").focus();
					return;
				}
				const actionButton = event.target.closest("[data-action]");
				if (actionButton) {
					action(actionButton.dataset.action);
					return;
				}
				const filter = event.target.closest("[data-filter]");
				if (filter) {
					state.filter = filter.dataset.filter;
					render();
					return;
				}
				const step = event.target.closest("[data-step]");
				if (step) {
					state.selectedStep[getRun().id] = step.dataset.step;
					state.source = "all";
					render();
					return;
				}
				const source = event.target.closest("[data-source]");
				if (source) {
					state.source = source.dataset.source;
					state.request = 1;
					render();
					return;
				}
				const request = event.target.closest("[data-request]");
				if (request) {
					state.request = Number(request.dataset.request);
					render();
					return;
				}
				const caseTab = event.target.closest("[data-case-tab]");
				if (caseTab) {
					event.preventDefault();
					state.caseTab = caseTab.dataset.caseTab;
					render();
					return;
				}
				const settingsTab = event.target.closest("[data-settings-tab]");
				if (settingsTab) {
					event.preventDefault();
					state.settingsTab = settingsTab.dataset.settingsTab;
					render();
				}
			});
			document.addEventListener("input", (event) => {
				if (event.target.id === "search") {
					const cursor = event.target.selectionStart;
					state.search = event.target.value;
					render();
					$("#search").focus();
					$("#search").setSelectionRange(cursor, cursor);
				}
				if (event.target.id === "instruction") state.draft = event.target.value;
				if (
					event.target.id === "launch-count" ||
					event.target.id === "launch-budget"
				)
					$("#launch-total").textContent =
						"Total ceiling: " +
						money(
							Number($("#launch-count").value) *
								Number($("#launch-budget").value),
						);
			});
			document.addEventListener("change", (event) => {
				if (event.target.id === "agent") {
					state.agent = event.target.value;
					state.source = "all";
					state.request = 1;
					render();
				}
			});
			$("#dialog").addEventListener("cancel", (event) => {
				event.preventDefault();
				closeModal();
			});
			window.addEventListener("hashchange", () => {
				state.source = "all";
				state.request = 1;
				render({ focus: true });
				if (route()[0] === "runs" && route()[1])
					$('.view-nav a[aria-current="page"]')?.focus({ preventScroll: true });
				window.scrollTo(0, 0);
			});
			render();
		</script>
	</body>
</html>

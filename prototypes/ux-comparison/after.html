<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rehearse · Connected desktop prototype</title>
		<link rel="stylesheet" href="connected-base.css" />
		<link rel="stylesheet" href="connected.css" />
	</head>
	<body>
		<a class="skip" href="#main">Skip to content</a>
		<div id="app"></div>
		<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
		<div id="toast" role="status" aria-live="polite"></div>
		<script>
			const requestedScreen = new URLSearchParams(location.search).get(
				"screen",
			);
			if (!location.hash && requestedScreen) {
				const entries = {
					results: "/runs/r37/results/build",
					attempt: "/runs/r39/results/shape",
					context: "/runs/r41/context/build",
					comparison: "/compare/cmp1",
				};
				history.replaceState(
					null,
					"",
					location.pathname +
						"#" +
						(Object.hasOwn(entries, requestedScreen)
							? entries[requestedScreen]
							: "/runs"),
				);
			}

			const initialRuns = [
				{
					id: "r42",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "running",
					cost: 3.42,
					time: "8m 24s",
					version: "0a78c2",
					grade: "Pending",
					step: "build",
					when: "Today, 14:32",
					note: "Build is running · Shape accepted",
					progress: 1,
				},
				{
					id: "r41",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "completed",
					cost: 4.86,
					time: "12m 08s",
					version: "0a78c2",
					grade: "B",
					step: "build",
					when: "Today, 13:48",
					note: "Accepted · all checks passed",
					progress: 2,
				},
				{
					id: "r40",
					case: "audit-log",
					title: "Add a paginated audit log",
					kind: "Pipeline",
					state: "stopped",
					cost: 1.73,
					time: "5m 43s",
					version: "7733aa",
					grade: "C",
					step: "shape",
					when: "Today, 12:10",
					note: "Stopped at Shape · below minimum B",
					progress: 0,
				},
				{
					id: "g8",
					case: "audit-log",
					title: "Shape · shortened review instructions",
					kind: "Group",
					state: "completed",
					cost: 5.4,
					time: "7m 12s",
					version: "0a78c2",
					grade: "3/3 accepted",
					step: "shape",
					when: "Yesterday, 17:20",
					note: "3 attempts · checkpoint cp-a7 · candidate",
					progress: 1,
				},
				{
					id: "g7",
					case: "audit-log",
					title: "Shape · original review instructions",
					kind: "Group",
					state: "completed",
					cost: 7.26,
					time: "8m 06s",
					version: "7733aa",
					grade: "3/3 accepted",
					step: "shape",
					when: "Yesterday, 16:40",
					note: "3 attempts · checkpoint cp-a7 · before edit",
					progress: 1,
				},
				{
					id: "r39",
					noTranscript: true,
					case: "audit-log",
					title: "Replay Shape from r35",
					kind: "Replay",
					state: "completed",
					cost: 1.95,
					time: "6m 00s",
					version: "0a78c2",
					grade: "B",
					step: "shape",
					when: "Yesterday, 16:17",
					note: "From r35 / Shape · checkpoint cp-a7",
					progress: 1,
				},
				{
					id: "s12",
					case: "brief-reply",
					title: "Keep a technical reply concise",
					kind: "Session",
					state: "completed",
					cost: 0.08,
					time: "24s",
					version: "0a78c2",
					grade: "Passed",
					step: "session",
					when: "Yesterday, 15:02",
					note: "3 of 3 deterministic checks passed",
					progress: 1,
				},
				{
					id: "s11",
					case: "brief-reply",
					title: "Keep a technical reply concise",
					kind: "Session",
					state: "stopped",
					cost: 0,
					time: "—",
					version: "7733aa",
					grade: "Unavailable",
					step: "session",
					when: "Time not recorded",
					note: "Invocation failed · no reply or usage recorded",
					progress: 0,
					missing: true,
				},
			];
			initialRuns.splice(2, 0, {
				...initialRuns[1],
				id: "r37",
				finalOutcome: "FAIL",
				cost: 4.55,
				time: "11m 14s",
				when: "Today, 13:16",
				note: "Final FAIL · both steps accepted · empty-page contract missing",
			});
			function finalReading(run) {
				if (run.kind !== "Pipeline") return run.grade;
				if (run.state === "running") return "Pending";
				if (run.state !== "completed") return "Not reached";
				return run.finalOutcome || "PASS";
			}
			function elapsedLabel(seconds) {
				return (
					Math.floor(seconds / 60) +
					"m " +
					String(seconds % 60).padStart(2, "0") +
					"s"
				);
			}
			function elapsedSeconds(time) {
				const parts = time.match(/(?:(\d+)m )?(\d+)s/);
				if (!parts) return 0;
				return Number(parts[1] || 0) * 60 + Number(parts[2]);
			}
			function initializeReadings(run) {
				if (run.kind === "Group") return run;
				if (run.kind === "Pipeline") {
					if (run.step === "shape") {
						run.stepReadings = {
							shape: { cost: run.cost, seconds: elapsedSeconds(run.time) },
						};
						return run;
					}
					run.stepReadings = {
						shape: { cost: 1.18, seconds: 252 },
						build: {
							cost: Math.max(0, run.cost - 1.18),
							seconds: Math.max(0, elapsedSeconds(run.time) - 252),
						},
					};
					return run;
				}
				run.stepReadings = {
					[run.step]: { cost: run.cost, seconds: elapsedSeconds(run.time) },
				};
				return run;
			}
			function stepMetrics(run, step) {
				const phase = stepPhase(run, step),
					reading = run.stepReadings?.[step];
				if (phase === "queued")
					return { cost: "Pending", time: "Not started", value: 0 };
				if (phase === "unavailable" || !reading)
					return { cost: "Unavailable", time: "Not recorded", value: 0 };
				return {
					cost: money(reading.cost),
					time:
						elapsedLabel(reading.seconds) +
						(phase === "running" ? " so far" : ""),
					value: reading.cost,
				};
			}
			function finishReadings(run) {
				const ceiling = run.budget || 10;
				if (run.kind === "Pipeline") {
					const total = Math.min(4.86, ceiling),
						shape = Math.min(1.18, total * 0.25);
					run.stepReadings = {
						shape: { cost: shape, seconds: 252 },
						build: { cost: total - shape, seconds: 476 },
					};
					run.cost = total;
					run.time = "12m 08s";
					run.step = "build";
					run.progress = 2;
					return;
				}
				const cost = Math.min(run.step === "session" ? 0.08 : 1.8, ceiling),
					seconds = run.step === "session" ? 24 : 360;
				run.stepReadings = { [run.step]: { cost, seconds } };
				run.cost = cost;
				run.time = elapsedLabel(seconds);
				run.progress = 1;
			}
			initialRuns.splice(3, 0, {
				...initialRuns[1],
				id: "r36",
				finalOutcome: "Judging failed",
				cost: 4.64,
				time: "12m 10s",
				when: "Today, 12:45",
				note: "Final judge failed · no verdict returned",
			});
			function finalReport(run) {
				if (run.kind !== "Pipeline") return "";
				const outcome = finalReading(run);
				const descriptions = {
					FAIL: "The final artifact omits a required response field, although both workflow steps were accepted.",
					PASS: "The final artifact meets the task rubric. Step grades remain independent evidence.",
					Pending: "The workflow has not reached the independent final Judge.",
					"Judging failed":
						"The final Judge did not return a verdict. This is missing evidence, not a failed task.",
					"Not reached":
						"Execution ended before final judging. Accepted step grades remain inspectable.",
				};
				return `<section class="panel connected-outcome ${outcome === "FAIL" ? "failed" : ""}"><div><div class="row"><span class="badge ${outcome === "FAIL" ? "stopped" : ""}">${esc(outcome)}</span><h2>Final task result</h2></div><p>${descriptions[outcome]}</p></div>${["PASS", "FAIL"].includes(outcome) ? btn("Inspect final evidence", "final-evidence", "primary") : `<a class="btn" href="${runHref(run, "activity")}">Inspect activity</a>`}</section>`;
			}

			function costReading(groupId) {
				const costs = state.runs
					.filter((item) => item.parent === groupId)
					.map((item) => item.cost);
				return (
					money(costs.reduce((a, b) => a + b, 0) / costs.length) +
					" · " +
					money(Math.min(...costs)) +
					"–" +
					money(Math.max(...costs))
				);
			}
			const comparisonArmIds = ["g7", "g8", "g6"];
			const isAccepted = (run) =>
				run.state === "completed" && ["A", "B", "Passed"].includes(run.grade);
			const initialInstruction =
				"Read the relevant evidence once. Give each reviewer the shared evidence, then inspect only the findings that need verification.";
			function initialState() {
				return {
					defaultBudget: 10,
					reviews: {},
					reviewTarget: null,
					runs: structuredClone(initialRuns).map(initializeReadings),
					filter: "All",
					search: "",
					selectedStep: {},
					investigations: {},
					contextKey: null,
					source: "all",
					agent: "parent",
					request: 1,
					follow: true,
					caseTab: "Overview",
					settingsTab: "General",
					version: "0a78c2",
					instructionFiles: {},
					editPath: "skills/review/SKILL.md",
					editContext: null,
					lastEdit: null,
					launchSource: null,
					lastStepRoute: null,
					review: "B",
					versionCounter: 0,
				};
			}
			const state = initialState();
			const $ = (selector) => document.querySelector(selector);
			const esc = (text) =>
				String(text)
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;")
					.replaceAll("'", "&#39;");
			const money = (value) => "$" + value.toFixed(2);
			const icons = {
				runs: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
				compare: '<path d="M3 3v18M21 3v18M7 7h10l-3-3m3 13H7l3 3"/>',
				cases:
					'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 5V3h8v2M3 11h18"/>',
				corpus:
					'<path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3zM7 16h13M8 7h8M8 11h6"/>',
				settings:
					'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
			};
			const icon = (name) =>
				'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
				icons[name] +
				"</svg>";
			const badge = (run) =>
				'<span class="badge ' +
				run.state +
				'">' +
				{
					running: "● Running",
					completed: "✓ Completed",
					stopped: "■ Stopped",
					paused: "Ⅱ Paused",
				}[run.state] +
				"</span>";
			const btn = (label, action, kind = "") =>
				'<button class="btn ' +
				kind +
				'" data-action="' +
				action +
				'">' +
				label +
				"</button>";
			const notice = (text, warning = false) =>
				'<div class="notice ' +
				(warning ? "warn-note" : "") +
				'">' +
				text +
				"</div>";
			const route = () =>
				(location.hash.slice(1) || "/runs").split("/").filter(Boolean);
			const runView = (run, view) =>
				["overview", "report", "results"].includes(view)
					? "results"
					: ["activity", "context"].includes(view)
						? view
						: run?.state === "running"
							? "activity"
							: "results";

			const runHref = (run, view) =>
				"#/runs/" + run.id + "/" + runView(run, view);

			const getRun = () => state.runs.find((run) => run.id === route()[1]);
			const stepsFor = (run) =>
				run.kind === "Pipeline" || run.groupMode === "pipeline"
					? ["shape", "build"]
					: [run.step];
			const selectedStep = (run) => state.selectedStep[run.id] || run.step;
			const stat = (label, value, note = "") =>
				'<div class="stat"><span class="label">' +
				label +
				"</span><strong>" +
				value +
				'</strong><small class="muted">' +
				note +
				"</small></div>";
			function shell(content) {
				const section = route()[0];
				const nav = [
					["runs", "Runs"],
					["compare", "Comparisons"],
					["cases", "Cases"],
					["corpus", "Corpus"],
					["settings", "Settings"],
				];
				const running = state.runs.filter(
					(run) => run.state === "running" && !run.parent,
				).length;
				return (
					'<div class="app"><aside class="sidebar"><a class="brand" href="#/runs">Rehearse <span class="brand-note">connected demo</span></a><a class="corpus-card" href="#/corpus"><span class="eyebrow">Corpus under test</span><span class="mono">corpus@' +
					state.version +
					'</span><small class="muted">137 files · demo snapshot</small></a><nav class="global-nav" aria-label="Main navigation">' +
					nav
						.map(
							([id, label]) =>
								'<a class="nav-link ' +
								(section === id ? "active" : "") +
								'" ' +
								(section === id ? 'aria-current="page"' : "") +
								' href="#/' +
								id +
								'">' +
								icon(id) +
								label +
								(id === "runs" && running
									? '<span class="count">' + running + " live</span>"
									: "") +
								"</a>",
						)
						.join("") +
					'</nav><button class="btn global-search" data-action="search-global">Search workspace <kbd>/</kbd></button><div class="sidebar-bottom"><span class="eyebrow">Prototype</span><p>Synthetic records.<br>Actions change this demo only.</p><button class="btn" data-action="reset">Reset demo</button></div></aside><main class="main" id="main" tabindex="-1"><div class="prototype-bar"><span><strong>Interactive prototype</strong> · synthetic data · actions are simulated</span><a href="index.html">Before & after gallery ↗</a></div><div class="content ' +
					(section === "runs" && getRun() ? "workspace-content" : "") +
					'" data-view="' +
					esc(runView(getRun(), route()[2])) +
					'">' +
					content +
					"</div></main>" +
					liveStrip() +
					"</div>"
				);
			}
			function runCeiling(run) {
				return (run.budget || 10) * (run.kind === "Group" ? run.count || 3 : 1);
			}
			function liveStrip() {
				const live = state.runs.filter(
					(run) => run.state === "running" && !run.parent,
				);
				if (!live.length) return "";
				const run = live[0];
				return (
					'<footer class="live-strip" aria-label="Active runs"><span class="live">●</span><a class="mono" href="' +
					runHref(run, "activity") +
					'">' +
					run.id +
					"</a><span>" +
					esc(run.case) +
					'</span><span class="strip-divider">' +
					esc(run.step) +
					' · running</span><span class="mono">' +
					money(run.cost) +
					'<span class="muted"> / ' +
					money(runCeiling(run)) +
					'</span></span><span class="mini-meter" aria-hidden="true"><i style="--value:' +
					Math.min(100, (run.cost / runCeiling(run)) * 100) +
					'%"></i></span><span class="mono muted">' +
					run.time +
					'</span><span class="strip-end">' +
					(live.length > 1
						? '<a href="#/runs">' + live.length + " active runs</a>"
						: "") +
					'<a class="btn" href="' +
					runHref(run, "activity") +
					'">Open activity →</a></span></footer>'
				);
			}
			function runTable(runs) {
				return (
					'<div class="table-scroll"><table class="history-table"><thead><tr><th scope="col">Run</th><th scope="col">Case</th><th scope="col">Status</th><th scope="col">Step grades</th><th scope="col">Outcome</th><th scope="col">Corpus</th><th scope="col">Cost</th><th scope="col">Wall</th></tr></thead><tbody>' +
					runs.map(runRow).join("") +
					"</tbody></table></div>"
				);
			}

			function runRow(run) {
				const grades =
					run.kind === "Group"
						? run.grade
						: stepsFor(run)
								.map((step) => step + " " + stepGrade(run, step))
								.join(" · ");
				return (
					'<tr class="' +
					(run.state === "running" ? "active-run" : "") +
					'"><th scope="row"><a class="mono" href="' +
					runHref(run) +
					'">' +
					run.id +
					'</a><small class="muted">' +
					run.when +
					'</small></th><td><a class="case-link mono" href="' +
					runHref(run) +
					'">' +
					esc(run.case) +
					'</a><small class="muted">' +
					run.kind +
					"</small></td><td>" +
					badge(run) +
					'<small class="muted row-note">' +
					run.note +
					'</small></td><td class="mono step-grades">' +
					grades +
					'</td><td><span class="mono">' +
					finalReading(run) +
					'</span><small class="muted">' +
					(run.kind === "Pipeline"
						? "independent final judge"
						: run.kind === "Group"
							? "repeated attempts"
							: run.kind === "Replay"
								? "step only"
								: "deterministic checks") +
					'</small></td><td><span class="mono">' +
					run.version +
					'</span><small class="muted">' +
					(run.version === state.version
						? "✓ Current corpus"
						: "◐ Corpus changed") +
					'</small></td><td class="mono numeric">' +
					(run.missing ? "Unavailable" : money(run.cost)) +
					'</td><td class="mono numeric">' +
					run.time +
					"</td></tr>"
				);
			}

			function runsPage() {
				const indexed = state.runs
					.filter((run) => !run.parent)
					.sort(
						(left, right) =>
							Number(right.state === "running") -
							Number(left.state === "running"),
					);
				const live = indexed.filter((run) => run.state === "running");
				const filtered = indexed.filter((run) => {
					let matches = true;
					switch (state.filter) {
						case "All":
							break;
						case "Running":
							matches = run.state === "running";
							break;
						case "Failed":
							matches =
								finalReading(run) === "FAIL" ||
								(run.grade === "C" && run.state !== "running");
							break;
						case "Stopped":
							matches = ["stopped", "paused"].includes(run.state);
							break;
						case "Current corpus":
							matches = run.version === state.version;
							break;
						default:
							matches = run.kind === state.filter;
					}
					return (
						matches &&
						[run.case, run.title, run.id, run.version, run.note]
							.join(" ")
							.toLowerCase()
							.includes(state.search.toLowerCase())
					);
				});
				return (
					'<header class="page-head"><div><h1>Runs</h1><p>Follow a run. Inspect its evidence. Test the next change.</p></div>' +
					btn("+ New run", "launch", "primary") +
					"</header>" +
					'<div class="toolbar"><div class="row gap2" role="group" aria-label="Filter runs">' +
					[
						"All",
						"Running",
						"Failed",
						"Stopped",
						"Group",
						"Replay",
						"Session",
						"Current corpus",
					]
						.map(
							(f) =>
								'<button class="chip" data-filter="' +
								f +
								'" aria-pressed="' +
								(state.filter === f) +
								'">' +
								({ Group: "Groups", Replay: "Replays", Session: "Sessions" }[
									f
								] || f) +
								"</button>",
						)
						.join("") +
					'</div><label class="search"><input id="search" type="search" aria-label="Search runs" placeholder="Search case, run, corpus…" value="' +
					esc(state.search) +
					'" /></label></div><section class="panel" aria-label="Run history"><div class="panel-head"><h2>History</h2><span class="small muted">' +
					filtered.length +
					" records · " +
					live.length +
					' running · newest first</span></div><div id="run-rows">' +
					(filtered.length
						? runTable(filtered)
						: '<div class="empty"><h2>No matching runs</h2><p>Try another case, corpus version, or filter.</p></div>') +
					'</div></section><p class="muted small" style="margin-top:var(--s4)">Synthetic examples include missing evidence and failed invocations. A missing measurement is never zero.</p>'
				);
			}
			function stepPhase(run, step) {
				if (run.missing) return "unavailable";
				if (step === "build" && run.step === "shape" && run.progress < 2)
					return "queued";
				if (run.state === "running" && step === run.step) return "running";
				if (run.state === "stopped" && step === run.step)
					return run.grade === "Not judged" ? "unjudged" : "stopped";
				return "accepted";
			}
			function stepGrade(run, step) {
				if (run.kind === "Group")
					return run.grade === "Not judged" ? "?" : run.grade.split(" ")[0];
				return {
					unavailable: "?",
					queued: "—",
					running: "…",
					unjudged: "?",
					stopped: "C",
					accepted: step === "session" ? "✓" : "B",
				}[stepPhase(run, step)];
			}
			function stepSummary(run, step) {
				if (run.kind === "Group")
					return [
						run.state === "running"
							? "● Running"
							: run.state === "stopped"
								? "■ Stopped"
								: "✓ Repetitions ended",
						"Open attempts · " + run.grade,
					];
				return {
					unavailable: ["No session", "Invocation failed"],

ce</td><td>${baseline.accepted}/${baseline.attempts.length} · ${interval(baseline)}</td><td>${candidate.accepted}/${candidate.attempts.length} · ${interval(candidate)}</td><td>95% intervals overlap · inconclusive</td></tr><tr><td>Hard blockers</td><td>0/${baseline.attempts.length} fired</td><td>0/${candidate.attempts.length} fired</td><td>Small sample · uncertainty remains</td></tr><tr><td>Cost / attempt</td><td>${costReading("g7")}</td><td>${costReading("g8")}</td><td>${change(candidate.mean, baseline.mean)} mean · ranges overlap</td></tr><tr><td>Reply length</td><td>${Math.round(baseline.words)} words</td><td>${Math.round(candidate.words)} words</td><td>${change(candidate.words, baseline.words)} mean · rerun noise unresolved</td></tr><tr><td>Cost against control</td><td>${change(baseline.mean, control.mean)}</td><td>${change(candidate.mean, control.mean)}</td><td>Control ${money(control.mean)} / attempt · inspect all arms</td></tr></tbody></table></div></section><div class="two-col"><section class="panel pad stack"><h2>One changed instruction</h2><a href="#/corpus/skills%2Freview%2FSKILL.md">skills/review/SKILL.md →</a><p class="muted">Only this corpus path differs between baseline and candidate. The same frozen input, model and effort are held fixed.</p>${btn("Inspect instruction diff", "diff")}</section><section class="panel pad stack"><h2>What this can support</h2><p class="muted">A hypothesis for another trial. Successful checks do not establish equivalent quality. The control removes this instruction; inspect each attempt before attributing an effect.</p>${btn("Inspect independent attempts", "attempts")}</section></div></div>`;

				const control = {
					...state.runs.find((item) => item.id === "g7"),
					id: "g6",
					when: "Yesterday, 16:30",
					title: "Shape · instruction removed",
					version: "91b220",
					cost: 3.36,
					grade: "1/3 accepted",
					note: "3 attempts · control · instruction removed",
				};
				state.runs.splice(
					state.runs.findIndex((item) => item.id === "r39"),
					0,
					control,
				);
				for (const group of state.runs.filter((r) => r.kind === "Group"))
					for (let i = 1; i <= 3; i++)
						state.runs.push(
							initializeReadings({
								...group,
								id: group.id + "-rep" + i,
								kind: "Replay",
								title: "Shape · attempt " + i + " of " + group.id,
								cost: (group.id === "g7"
									? [1.6, 2.46, 3.2]
									: group.id === "g8"
										? [1.4, 1.7, 2.3]
										: [1.02, 1.17, 1.17])[i - 1],
								words: (group.id === "g7"
									? [360, 430, 470]
									: group.id === "g8"
										? [280, 308, 360]
										: [300, 390, 420])[i - 1],
								grade: group.id === "g6" && i < 3 ? "C" : "B",
								state: group.id === "g6" && i < 3 ? "stopped" : "completed",
								note: "Independent attempt " + i + " · from " + group.id,
								when: "Yesterday · group " + group.id,
								step: "shape",
								parent: group.id,
							}),
						);
				const suppliedReplay = state.runs.find((item) => item.id === "r39");
				const suppliedSource = state.runs.find((item) => item.id === "r41");
				suppliedReplay.sourceId = "r41";
				suppliedReplay.title = "Replay Shape from r41";
				suppliedReplay.note = "From r41 / Shape · checkpoint cp-a7";
				suppliedReplay.comparisonSource = snapshotStep(suppliedSource, "shape");
			}
			seedAttempts();
			document.addEventListener("click", (event) => {
				if (event.target.closest(".skip")) {
					event.preventDefault();
					$("#main").focus();
					return;
				}
				const actionButton = event.target.closest("[data-action]");
				if (actionButton) {
					action(actionButton.dataset.action);
					return;
				}
				const filter = event.target.closest("[data-filter]");
				if (filter) {
					state.filter = filter.dataset.filter;
					render();
					return;
				}
				const source = event.target.closest("[data-source]");
				if (source) {
					state.source = source.dataset.source;
					state.request = 1;
					render();
					return;
				}
				const request = event.target.closest("[data-request]");
				if (request) {
					state.request = Number(request.dataset.request);
					render();
					return;
				}
			});
			document.addEventListener("input", (event) => {
				if (event.target.id === "search") {
					const cursor = event.target.selectionStart;
					state.search = event.target.value;
					render();
					$("#search").focus();
					$("#search").setSelectionRange(cursor, cursor);
				}
				if (event.target.id === "instruction")
					instructionFile().draft = event.target.value;
				if (
					event.target.id === "launch-count" ||
					event.target.id === "launch-budget"
				)
					$("#launch-total").textContent =
						"Total ceiling: " +
						money(
							Number($("#launch-count").value) *
								Number($("#launch-budget").value),
						);
			});
			document.addEventListener("change", (event) => {
				if (event.target.id === "agent") {
					state.agent = event.target.value;
					state.source = "all";
					state.request = 1;
					render();
				}
			});
			$("#dialog").addEventListener("cancel", (event) => {
				event.preventDefault();
				closeModal();
			});
			window.addEventListener("hashchange", () => {
				render({ focus: true });
				if (route()[0] === "runs" && route()[1])
					$('.view-nav a[aria-current="page"]')?.focus({ preventScroll: true });
				window.scrollTo(0, 0);
			});
			render();
		</script>
	</body>
</html>
